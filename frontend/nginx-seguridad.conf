# Cabeceras de seguridad de todo lo que sirve nginx (spec 024, riesgo RS6). Se incluye en cada
# location de nginx.conf: un add_header dentro de una location anula los del server (review 022/R22).
# /api/ y /uploads/ no lo incluyen: Express ya manda las suyas (helmet, spec 018).
# Un servicio externo nuevo (script, marco, imagen) exige añadirlo aquí y en
# tests/seguridad-cabeceras.test.js y tests/seguridad-recursos.test.js.

# Solo el propio sitio, Google Sign-In (login) y el mapa de Google (contacto). Scripts sin código en
# línea ni eval; estilos en línea permitidos (Google Sign-In y las proporciones de las fotos);
# blob: para las vistas previas de imagen de los paneles; data: para una fuente incrustada en el CSS
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/ https://maps.google.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Nadie puede mostrar el sitio dentro de un marco (navegadores sin frame-ancestors)
add_header X-Frame-Options "DENY" always;

# El navegador no adivina el tipo de un archivo distinto al declarado
add_header X-Content-Type-Options "nosniff" always;

# Al ir a otro sitio solo se comunica el dominio (nunca la ruta, p. ej. ?token= de restablecer contraseña)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El sitio no usa cámara, micrófono ni ubicación
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Solo HTTPS durante 1 año, como la API; sin subdominios ni precarga (decisión del usuario, 2026-11-19)
add_header Strict-Transport-Security "max-age=31536000" always;
