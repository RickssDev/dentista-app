server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: detrás de Caddy/Cloudflare el esquema público es https (spec 022)
    absolute_redirect off;

    # Texto comprimido (spec 023, CA10); text/html se comprime siempre que gzip está activo
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    # Sin application/json: las respuestas de la API llevan el token y datos de pacientes (BREACH);
    # text/javascript además de application/javascript porque nginx está cambiando el tipo de los .js
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript image/svg+xml;

    # Cabeceras de seguridad (spec 024): cada location que sirve contenido propio incluye
    # snippets/seguridad.conf, porque un add_header dentro de una location anula los del server
    # (review 022/R22). /api/ y /uploads/ no: Express ya manda las suyas (helmet)

    # Peticiones a Express (^~: las reglas de abajo no las tocan)
    location ^~ /api/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes y archivos del backend
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
    }

    # Una sola URL por página: sin barra final (/nosotros/ → /nosotros), con su query string.
    # Solo caracteres seguros de ruta y sin "//" al inicio: una "\" o un salto de línea podrían
    # convertir la redirección en un salto a otro dominio (review 022 R2); lo demás es un 404
    location ~ "^(/[A-Za-z0-9._~-][A-Za-z0-9._~/-]*)/$" {
        include /etc/nginx/snippets/seguridad.conf;
        return 301 $1$is_args$args;
    }

    # Páginas públicas prerenderizadas (spec 022)
    location = / { include /etc/nginx/snippets/seguridad.conf; try_files /index.html =404; }
    location = /nosotros { include /etc/nginx/snippets/seguridad.conf; try_files /nosotros/index.html =404; }
    location = /galeria { include /etc/nginx/snippets/seguridad.conf; try_files /galeria/index.html =404; }
    location = /contacto { include /etc/nginx/snippets/seguridad.conf; try_files /contacto/index.html =404; }
    location = /aviso-de-privacidad { include /etc/nginx/snippets/seguridad.conf; try_files /aviso-de-privacidad/index.html =404; }
    location = /terminos-de-servicio { include /etc/nginx/snippets/seguridad.conf; try_files /terminos-de-servicio/index.html =404; }

    # Archivos con huella en el nombre: no cambian nunca, se guardan un año (spec 023, CA10)
    location ^~ /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Login prerenderizado (spec 023): ya pintado y fuera de los buscadores. Va antes de la regla de
    # rutas privadas porque nginx usa la primera expresión regular que coincide
    location ~ ^/login$ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files /login.html =404;
    }

    # Rutas privadas: la SPA sin contenido y fuera de los buscadores
    location ~ ^/(login|restablecer-contrasena|admin|paciente)(/.*)?$ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files /app.html =404;
    }

    # Archivos estáticos; lo que no existe es un 404 real con la página propia
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/seguridad.conf;
        internal;
    }
}
