server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: detrás de Caddy/Cloudflare el esquema público es https (spec 022)
    absolute_redirect off;

    # Peticiones a Express (^~: las reglas de abajo no las tocan)
    location ^~ /api/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imágenes y archivos del backend
    location ^~ /uploads/ {
        proxy_pass http://backend:3000;
    }

    # Una sola URL por página: sin barra final (/nosotros/ → /nosotros)
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    # Páginas públicas prerenderizadas (spec 022)
    location = / { try_files /index.html =404; }
    location = /nosotros { try_files /nosotros/index.html =404; }
    location = /galeria { try_files /galeria/index.html =404; }
    location = /contacto { try_files /contacto/index.html =404; }
    location = /aviso-de-privacidad { try_files /aviso-de-privacidad/index.html =404; }
    location = /terminos-de-servicio { try_files /terminos-de-servicio/index.html =404; }

    # Rutas privadas: la SPA sin contenido y fuera de los buscadores
    location ~ ^/(login|restablecer-contrasena|admin|paciente)(/.*)?$ {
        add_header X-Robots-Tag "noindex" always;
        try_files /app.html =404;
    }

    # Archivos estáticos; lo que no existe es un 404 real con la página propia
    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
