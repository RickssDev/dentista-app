# Generado por /init (ai-dd). Valida el flujo y la seguridad en cada PR.
# Modo baseline: los pasos de seguridad solo fallan por problemas NUEVOS del PR, para que la deuda
# previa (registrada en docs/security.md) no bloquee todos los PRs. Un job semanal revisa el repo
# completo y reporta sin bloquear.
name: ai-dd

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # revisión completa semanal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flujo:
    name: Artefactos del flujo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validar specs, planes y tareas
        run: python .ai/bin/aidd.py validate

  calidad:
    name: Lint y build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Instalar backend
        run: npm ci
        working-directory: backend
      - name: Instalar frontend
        run: npm ci
        working-directory: frontend
      - name: Lint de los archivos cambiados del PR
        working-directory: frontend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.js' '*.jsx' '*.mjs' \
            | grep '^frontend/' | sed 's#^frontend/##' \
            | xargs -r npx eslint
      - name: Lint de backend en los archivos cambiados del PR
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD -- '*.js' \
            | grep '^backend/' | sed 's#^backend/##' \
            | xargs -r npx eslint
      - name: Pruebas
        timeout-minutes: 5
        run: npm test
      - name: Build del frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
      - name: Prueba de nginx del frontend (spec 022)
        timeout-minutes: 10
        run: node scripts/probar-nginx.mjs
        working-directory: frontend

  seguridad-pr:
    name: Seguridad (solo cambios del PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secretos en los commits del PR
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git --no-banner --log-opts="origin/$BASE_REF..HEAD" /repo
      - name: Dependencias, solo si el PR cambia lockfiles
        run: |
          if git diff --name-only "origin/$BASE_REF"...HEAD | grep -qE 'package-lock\.json$'; then
            npm --prefix backend audit --audit-level=high
            npm --prefix frontend audit --audit-level=high
          else
            echo "El PR no cambia dependencias"
          fi

  seguridad-completa:
    name: Seguridad (repo completo, informativo)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true   # reporta la deuda sin bloquear; cada hallazgo alto va a docs/security.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git --no-banner /repo
      - run: npm --prefix backend audit --audit-level=high || true
      - run: npm --prefix frontend audit --audit-level=high || true
      - run: docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.58.1 fs --scanners vuln,misconfig .
